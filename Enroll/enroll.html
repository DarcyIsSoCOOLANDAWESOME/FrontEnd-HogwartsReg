<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Enrollment</title>
    <link rel="stylesheet" href="enroll/enroll.css" />
  </head>

  <body>
    <h1>Select your courses!</h1>
    <h4>Enrolment of New Students - Academic Year 2026</h4>

    <div class="optionsGrid">
      <p>Course Enrolment (Select 3 Courses)</p>
      <p id="numSelected">Selected [0/3]</p>

      <div class="course-container">
        <button class="btn option" type="button">
          Course 1
        </button>
        <button class="btn option" type="button">Course 2</button>
        <button class="btn option" type="button">Course 3</button>
        <button class="btn option" type="button">C4</button>
        <button class="btn option" type="button">Course 5</button>
        <button class="btn option" type="button">History of Magic</button>
        <button class="btn option" type="button">Astronomy</button>
        <button class="btn option" type="button">Muggle Studies</button>
        <button class="btn option" type="button">Magical Transportation</button>
      </div>
    </div>

    <div>
      <a href="enroll.html">
        <button type="button">Clear Selection</button>
      </a>

      <button id="submitBtn" type="button">Submit Choices</button>

      <p>Extra small p, Please Ensure you have chosen exactly 3 courses</p>
    </div>

    <script src="enroll/enroll.js"></script>
  </body>
</html>
