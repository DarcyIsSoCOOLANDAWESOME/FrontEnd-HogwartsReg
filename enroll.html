<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Enrollment</title>
    <link rel="stylesheet" href="enroll.css" />
</head>

<body>
    
    <h1>The Hogwarts Registry</h1>
    <h4>Enrolment of New Students - Academic Year 2026</h4>

    <div class="optionsGrid">

        <p>Course Enrolment (Select 3 Courses)</p>
        <p id="numSelected">Selected [0/3]</p>

        <button class="btn option">1</button>
        <button class="btn option">2</button>
        <button class="btn option">3</button>
        <button class="btn option">4</button>
        <button class="btn option">5</button>
        <button class="btn option">6</button>
        <button class="btn option">7</button>
        <button class="btn option">8</button>
        <button class="btn option">9</button>
    </div>

    <div>
        
        <a href="enroll.html">
             <button>Clear Selection</button>
        </a>
        
       
        
        
        <button>Submit Choices</button>

        <p>Extra small p, Please Ensure you have chosen exactly 3 courses</p>

    </div>



</body>

<script src="./enroll.js" type="module" ></script>

</html>
