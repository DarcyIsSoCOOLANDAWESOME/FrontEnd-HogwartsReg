<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <h1>Welcome, <span id="welcomeName">Student</span></h1>
    <h4>Current Enrollment Details</h4>

    <div class="defaultBorder">
      <h4>Student Profile</h4>

      <img
        id="houseCrest"
        src=""
        alt="house symbol"
        style="width: 50px; height: 50px; display: none"
      />

      <p>Name: <span id="profileName">Loading...</span></p>
      <p>Email: <span id="profileEmail">Loading...</span></p>
      <p>House: <span id="profileHouse">Loading...</span></p>
      <p>Age: <span id="profileAge">Loading...</span></p>
    </div>

    <div id="coursesBox" class="defaultBorder">
      <h4>Enrolled Courses</h4>
      <p>Your selected magical courses will appear here.</p>
    </div>

    <button id="deleteBtn">Leave Hogwarts</button>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
