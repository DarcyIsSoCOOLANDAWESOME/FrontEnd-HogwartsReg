<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hogwarts Registry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
        <form action=""> <div id="titles-personal">
        <h1>The Hogwarts Registry</h1>
        <h4>Enrolment of New Students - Academic Year 2026</h4>
        <h5>Personal details</h5>
      </div>

      <div id="personal-details">
        <label for="firstname">First Name</label>
        <input type="text" name="firstname" id="firstname" />

        <label for="lastname">Last Name</label>
        <input type="text" name="lastname" id="lastname" />

        <label for="sex">Sex</label>
        <select name="sex" id="sex">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>

        <label for="age">Age</label>
        <input type="number" name="age" id="age" />
      </div>
      <div id="titles-sortinghat">
        <h5>Sorting Hat</h5>
        <p>Choose Your House, or let the sorting hat decide your fate...</p>
      </div>
      <div id="house--btns">
        <button class="gryf--Btn">Gryffindor</button>
        <button class="slyth--Btn">Slytherin</button>
        <button class="rave--Btn">Ravenclaw</button>
        <button class="huff--Btn">Hufflepuff</button>
      </div>
      <div id="random-house">
        <button class="rand--btn">Let the sorting hat choose</button>
      </div>
      <div id="titles-account"><h5>Account & Access</h5></div>

      <div id="account-access">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" />
        <label for="password">Password</label>
        <input type="password" name="password" id="password" />
      </div>
      <div id="enrol"><button>Enrol</button></div>
    </main></form>
      
  </body>
</html>
