<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hogwarts Registry</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <form id="regForm" action="">
        <div id="titles-personal">
          <h1>The Hogwarts Registry</h1>
          <h4>Enrolment of New Students - Academic Year 2026</h4>
          <h5>Personal details</h5>
        </div>

        <div id="personal-details">
          <label for="firstName">First Name</label>
          <input type="text" name="firstName" id="firstName" />

          <label for="lastName">Last Name</label>
          <input type="text" name="lastName" id="lastName" />

          <label for="age">Age</label>
          <input type="number" name="age" id="age" min="1" />
        </div>

        <div id="titles-sortinghat">
          <h5>Sorting Hat</h5>
          <p>Choose Your House, or let the sorting hat decide your fate...</p>
        </div>

        <div id="house--btns">
          <input type="radio" id="Gryffindor" name="house" value="Gryffindor" />
          <label for="Gryffindor">Gryffindor</label>

          <input type="radio" id="Slytherin" name="house" value="Slytherin" />
          <label for="Slytherin">Slytherin</label>

          <input type="radio" id="Ravenclaw" name="house" value="Ravenclaw" />
          <label for="Ravenclaw">Ravenclaw</label>

          <input type="radio" id="Hufflepuff" name="house" value="Hufflepuff" />
          <label for="Hufflepuff">Hufflepuff</label>
        </div>

        <div id="random-house">
          <button type="button" class="rand--btn">
            Let the sorting hat choose
          </button>
        </div>

        <div id="titles-account"><h5>Account & Access</h5></div>

        <div id="account-access">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" />
          <label for="password">Password</label>
          <input type="password" name="password" id="password" />
        </div>

        <div id="enrol">
          <button type="submit">Enrol</button>
        </div>
      </form>
    </main>
  </body>
  <script src="./sortingHat.js"></script>
  <script src="./register.js"></script>
</html>
